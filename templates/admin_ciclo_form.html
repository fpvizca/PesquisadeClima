{% extends "base.html" %}
{% block title %}{{ 'Editar' if ciclo else 'Novo' }} Ciclo - Pesquisa de Clima Vizca{% endblock %}
{% block titulo %}{{ 'Editar' if ciclo else 'Novo' }} Ciclo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">{{ 'Editar Ciclo' if ciclo else 'Novo Ciclo' }}</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome do Ciclo *</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ ciclo.nome if ciclo else '' }}" required
                   placeholder="Ex: Pesquisa de Clima 2025">
          </div>

          <div class="mb-3">
            <label for="formulario_id" class="form-label">Formulário</label>
            <select class="form-select" id="formulario_id" name="formulario_id">
              <option value="">-- Selecione um formulário --</option>
              {% for f in formularios %}
              <option value="{{ f.id }}" {% if ciclo and ciclo.formulario_id == f.id %}selected{% endif %}>
                {{ f.nome }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label for="ano" class="form-label">Ano *</label>
              <input type="number" class="form-control" id="ano" name="ano"
                     value="{{ ciclo.ano if ciclo else '' }}" required min="2020" max="2030">
            </div>
            <div class="col-md-4">
              <label for="data_inicio" class="form-label">Data de Início</label>
              <input type="date" class="form-control" id="data_inicio" name="data_inicio"
                     value="{{ ciclo.data_inicio if ciclo else '' }}">
            </div>
            <div class="col-md-4">
              <label for="data_fim" class="form-label">Data de Fim</label>
              <input type="date" class="form-control" id="data_fim" name="data_fim"
                     value="{{ ciclo.data_fim if ciclo else '' }}">
            </div>
          </div>

          <div class="mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="ativo" name="ativo"
                     {% if not ciclo or ciclo.ativo %}checked{% endif %}>
              <label class="form-check-label" for="ativo">
                <strong>Ciclo Ativo</strong>
                <br><small class="text-muted">Ao ativar, outros ciclos serão desativados automaticamente.</small>
              </label>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> {{ 'Salvar Alterações' if ciclo else 'Criar Ciclo' }}
            </button>
            <a href="{{ url_for('admin_ciclos') }}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> Voltar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
