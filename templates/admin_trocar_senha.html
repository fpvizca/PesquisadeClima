{% extends "base.html" %}
{% block title %}Trocar Senha - Pesquisa de Clima{% endblock %}
{% block titulo %}Trocar Senha{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-key"></i> Alterar Minha Senha</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-medium">Senha Atual</label>
            <input type="password" class="form-control" name="senha_atual" required placeholder="Digite sua senha atual">
          </div>

          <hr>

          <div class="mb-3">
            <label class="form-label fw-medium">Nova Senha</label>
            <input type="password" class="form-control" name="nova_senha" required placeholder="Mínimo 6 caracteres" minlength="6">
          </div>

          <div class="mb-4">
            <label class="form-label fw-medium">Confirmar Nova Senha</label>
            <input type="password" class="form-control" name="confirmar_senha" required placeholder="Repita a nova senha" minlength="6">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> Salvar Nova Senha
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> Voltar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
