{% extends "base.html" %}
{% block content %}
<div class="login-page">
  <div class="login-card">
    <img src="{{ url_for('static', filename='img/logo-cinza.png') }}" alt="Vizca" class="login-logo">
    <div class="brand-title">Pesquisa de Clima</div>
    <div class="brand-sub">Acesse sua conta para continuar</div>
    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label fw-medium">Usuário</label>
        <input type="text" name="login" class="form-control form-control-lg" placeholder="Seu usuário" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium">Senha</label>
        <input type="password" name="senha" class="form-control form-control-lg" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
